# gp_spec-plan.yaml | Vitalia SDD v0.6.0 | 07-09-2026 18:51(GMT-04:00)
# Guardian Profile para spec-plan.
# Domínios: GOVERNANCE + GROUNDING + INFRA + HARDWARE — arquitetura técnica exige tudo.

schema_type: "guardian_profile"
schema_version: "0.6.0"
workflow: "spec-plan"

tokens:
  total_budget: 500
  source_weights:
    constitution: 0.70
    grounding_domains: 0.30

constitution:
  domains: ["PURPOSE", "GOVERNANCE", "GROUNDING", "INFRASTRUCTURE", "SECRETS", "HARDWARE_AGNOSTICISM", "OBSERVABILITY"]
  severity_filter: ["BLOCKING", "WARNING"]
  principles_include: ["P00", "P01", "P02", "P03", "P04", "P06", "P11", "P15", "P16"]

session_context:
  include_p0: true
  include_active_feature: true
  include_agents_queue: false
