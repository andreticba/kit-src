# route e dispatcher leve -- constitution minima + routing_table + brainstorming_intents

schema_type: "guardian_profile"
schema_version: "0.6.0"
workflow: "vitalia-route"

tokens:
  total_budget: 450
  source_weights:
    constitution: 0.25
    routing_table: 0.75
    brainstorming_intents: 0.20
