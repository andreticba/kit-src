schema_type: "guardian_profile"
schema_version: "0.6.0"
workflow: "spec-specify"

tokens:
  total_budget: 480
  source_weights:
    constitution: 0.75
    grounding_domains: 0.25

constitution:
  domains: ["PURPOSE", "GOVERNANCE", "GROUNDING", "PRIVACY_DATA_VAULT", "REGULATORY_COMPLIANCE"]
  severity_filter: ["BLOCKING", "WARNING"]
  principles_include: ["P00", "P01", "P02", "P03", "P05", "P07", "P17"]

session_context:
  include_p0: true
  include_active_feature: true
  include_agents_queue: false
