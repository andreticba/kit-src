# gp_brainstorming.yaml | Vitalia SDD v0.6.0 | 14-09-2026 19:51(GMT-04:00)
# Guardian Profile para o workflow brainstorming (Supervisor).
# Contratos: C5, C7
# hardware_profile frontier: brainstorming NUNCA roda em LLM local (risco OOM GTX 1060).

schema_type: "guardian_profile"
schema_version: "0.6.0"
workflow: "brainstorming"

hardware_profile: "frontier"

tokens:
  total_budget: 650
  source_weights:
    constitution: 1.0
    brainstorming_intents: 0.40
    dynamic_questioning: 0.60
    agents_catalog: 0.30

constitution:
  domains: ["PURPOSE", "GOVERNANCE", "GROUNDING", "INFRASTRUCTURE", "HARDWARE_AGNOSTICISM", "AGENT_SECURITY", "CLINICAL_SAFETY"]
  severity_filter: ["BLOCKING", "WARNING"]
  principles_include: ["P00", "P01", "P02", "P03", "P04", "P08", "P09", "P11", "P12"]

session_context:
  include_p0: true
  include_active_feature: true
  include_agents_queue: false
  include_user_input: true
