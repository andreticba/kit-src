# gp_task-verifier.yaml | Vitalia SDD v0.6.0 | 07-09-2026 18:51(GMT-04:00)
# Guardian Profile para task-verifier.
# Objetivo: compliance total — apenas BLOCKING de GOVERNANCE e CLINICAL_SAFETY.
# O task-verifier já lê constitution.yaml diretamente; este profile adiciona filtro preciso.

schema_type: "guardian_profile"
schema_version: "0.6.0"
workflow: "task-verifier"

tokens:
  total_budget: 400
  source_weights:
    constitution: 1.0

constitution:
  domains: ["PURPOSE", "GOVERNANCE", "CLINICAL_SAFETY", "SECRETS", "AGENT_SECURITY"]
  severity_filter: ["BLOCKING"]
  principles_include: ["P00", "P01", "P05", "P06", "P09", "P12", "P14"]

session_context:
  include_p0: false
  include_active_feature: true
  include_agents_queue: false
